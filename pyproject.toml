[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "winflux"
version = "0.1.0rc1"
description = "Winflux (WFLX): blockchain UTXO com pagamentos offline encadeados — release candidate da testnet"
requires-python = ">=3.11"
dependencies = ["cryptography>=42"]
readme = "README.md"

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
winflux-node = "winflux.node.main:main"
winflux-wallet = "winflux.cli:main"
winflux-netgen = "winflux.tools.netgen:main"

[tool.setuptools.packages.find]
include = ["winflux*"]
